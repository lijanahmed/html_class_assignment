<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Shopping Cart</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eafff8;
            padding: 20px;
        }
        .pg {
            max-width: 500px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 0 10px rgba(10, 2, 2, 0.1);
        }
        h2 {
            text-align: center;
            color: #000000;
            text-shadow: 0 1px rgb(0, 0, 0);
        }
        .form {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }
        select,
        input[type="number"],
        input[type="text"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 10px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 5px;
        }
        button:hover {
            background-color: #015614;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: center;
        }
        .summary {
            margin-top: 20px;
            padding: 15px;
            background-color: #e9ecef;
            border-radius: 4px;
            display: none;
        }
    </style>
</head>
<body>

<div class="pg">
    <h2>Online Shopping Cart</h2>

    <div class="form">
        <label for="product">Select Product:</label>
        <select id="product">
            <option value="50000">Laptop - 50000 Tk</option>
            <option value="1000">Mouse - 1000 Tk</option>
            <option value="2500">Keyboard - 2500 Tk</option>
            <option value="15000">Monitor - 15000 Tk</option>
        </select>
    </div>

    <div class="form">
        <label for="quantity">Quantity:</label>
        <input type="number" id="quantity" min="1" value="1">
    </div>

    <button type="button" onclick="addToCart()">Add to Cart</button>

    <table>
        <thead>
            <tr>
                <th>Product</th>
                <th>Price</th>
                <th>Quantity</th>
                <th>Total</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="cartItems"></tbody>
    </table>

    <div class="form">
        <label for="coupon">Discount Coupon:</label>
        <input type="text" id="coupon" placeholder="Enter SAVE10">
    </div>

    <button type="button" onclick="generateInvoice()">Generate Invoice</button>

    <div id="summaryBox" class="summary">
        <h3>Shopping Invoice</h3>
        <p id="sumSubtotal"></p>
        <p id="sumDiscount"></p>
        <p id="sumVAT"></p>
        <p id="sumFinal"></p>
    </div>
</div>

<script>

    const VAT_RATE = 0.15;
    const COUPON_CODE = "SAVE10";
    const DISCOUNT_RATE = 0.10;

    let cart = [];

    // Task 1: Add Products to Cart
    function addToCart() {
        const productSelect = document.getElementById("product");
        const productName = productSelect.options[productSelect.selectedIndex].text.split(" - ")[0];
        const price = parseFloat(productSelect.value);
        const quantity = parseInt(document.getElementById("quantity").value);

        if (isNaN(quantity) || quantity <= 0) {
            alert("Please enter a valid quantity!");
            return;
        }

        const existingProduct = cart.find(item => item.name === productName);

        if (existingProduct) {
            existingProduct.quantity += quantity;
        } else {
            cart.push({ name: productName, price: price, quantity: quantity });
        }

        displayCart();
    }

    // Task 2: Update Quantity
    function updateQuantity(index, value) {
        const quantity = parseInt(value);

        if (isNaN(quantity) || quantity <= 0) {
            alert("Quantity must be at least 1!");
            displayCart();
            return;
        }

        cart[index].quantity = quantity;
        displayCart();
    }

    // Task 3: Calculate Subtotal Automatically
    function displayCart() {
        const cartItems = document.getElementById("cartItems");
        cartItems.innerHTML = "";

        cart.forEach((item, index) => {
            const row = document.createElement("tr");

            row.innerHTML = `
                <td>${item.name}</td>
                <td>${item.price} Tk</td>
                <td>
                    <input type="number" min="1" value="${item.quantity}"
                    onchange="updateQuantity(${index}, this.value)"
                    style="width:60px;">
                </td>
                <td>${item.price * item.quantity} Tk</td>
                <td>
                    <button type="button" onclick="removeProduct(${index})">
                    Remove</button>
                </td>
            `;

            cartItems.appendChild(row);
        });

        document.getElementById("summaryBox").style.display = "none";
    }

    // Remove Product from Cart
    function removeProduct(index) {
        cart.splice(index, 1);
        displayCart();
    }

    // Task 4, 5 and 6: Discount, VAT and Invoice
    function generateInvoice() {
        if (cart.length === 0) {
            alert("Please add at least one product to the cart!");
            return;
        }

        let subtotal = 0;

        cart.forEach(item => {
            subtotal += item.price * item.quantity;
        });

        let discount = 0;
        const coupon = document.getElementById("coupon").value.trim();

        if (coupon.toUpperCase() === COUPON_CODE) {
            discount = subtotal * DISCOUNT_RATE;
        }

        const vat = (subtotal - discount) * VAT_RATE;
        const finalPayment = subtotal - discount + vat;

        document.getElementById("sumSubtotal").textContent =
            "Subtotal: " + subtotal.toFixed(2) + " Tk";

        document.getElementById("sumDiscount").textContent =
            "Discount: " + discount.toFixed(2) + " Tk";

        document.getElementById("sumVAT").textContent =
            "VAT (15%): " + vat.toFixed(2) + " Tk";

        document.getElementById("sumFinal").textContent =
            "Final Payment: " + finalPayment.toFixed(2) + " Tk";

        document.getElementById("summaryBox").style.display = "block";
    }

</script>

</body>
</html>
