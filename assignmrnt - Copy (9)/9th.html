
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Management System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eafff8;
            padding: 20px;
        }
        .pg {
            max-width: 700px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 0 10px rgba(10, 2, 2, 0.1);
        }
        h2 {
            text-align: center;
            color: #000000;
            text-shadow: 0 1px rgb(0, 0, 0);
        }
        .form {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }
        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 10px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #015614;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: center;
        }
        .summary {
            margin-top: 20px;
            padding: 15px;
            background-color: #e9ecef;
            border-radius: 4px;
        }
    </style>
</head>
<body>

<div class="pg">
    <h2>Inventory Management System</h2>

    <form id="productForm">

        <div class="form">
            <label for="productName">Product Name:</label>
            <input type="text" id="productName" required>
        </div>

        <div class="form">
            <label for="purchasePrice">Purchase Price (Tk):</label>
            <input type="number" id="purchasePrice" min="0" required>
        </div>

        <div class="form">
            <label for="sellingPrice">Selling Price (Tk):</label>
            <input type="number" id="sellingPrice" min="0" required>
        </div>

        <div class="form">
            <label for="quantity">Quantity:</label>
            <input type="number" id="quantity" min="1" required>
        </div>

        <button type="button" onclick="addProduct()">Add Product</button>
    </form>

    <table>
        <thead>
            <tr>
                <th>Product</th>
                <th>Purchase Price</th>
                <th>Selling Price</th>
                <th>Quantity</th>
                <th>Stock Value</th>
                <th>Revenue</th>
                <th>Profit</th>
            </tr>
        </thead>
        <tbody id="productList"></tbody>
    </table>

    <div class="summary">
        <h3>Inventory Summary</h3>
        <p id="sumStock"></p>
        <p id="sumRevenue"></p>
        <p id="sumProfit"></p>
    </div>
</div>

<script>

    let products = [];

    // Task 1: Add Product
    function addProduct() {
        const productName = document.getElementById("productName").value.trim();
        const purchasePrice = parseFloat(document.getElementById("purchasePrice").value);
        const sellingPrice = parseFloat(document.getElementById("sellingPrice").value);
        const quantity = parseInt(document.getElementById("quantity").value);

        if (productName === "" ||
            document.getElementById("purchasePrice").value === "" ||
            document.getElementById("sellingPrice").value === "" ||
            document.getElementById("quantity").value === "" ||
            isNaN(purchasePrice) || isNaN(sellingPrice) || isNaN(quantity) ||
            purchasePrice < 0 || sellingPrice < 0 || quantity <= 0) {
            alert("Please fill in all fields correctly!");
            return;
        }

        const product = {
            name: productName,
            purchasePrice: purchasePrice,
            sellingPrice: sellingPrice,
            quantity: quantity
        };

        products.push(product);

        displayProducts();

        document.getElementById("productForm").reset();
    }

    // Task 2: Calculate Stock Value, Revenue and Profit
    function getCalculationData() {
        let totalStockValue = 0;
        let expectedRevenue = 0;
        let expectedProfit = 0;

        products.forEach(product => {
            totalStockValue += product.purchasePrice * product.quantity;
            expectedRevenue += product.sellingPrice * product.quantity;
            expectedProfit += (product.sellingPrice - product.purchasePrice) * product.quantity;
        });

        return {
            totalStockValue,
            expectedRevenue,
            expectedProfit
        };
    }

    // Task 3: Display Data in Dynamic Table
    function displayProducts() {
        const productList = document.getElementById("productList");
        productList.innerHTML = "";

        products.forEach(product => {
            const row = document.createElement("tr");

            row.innerHTML = `
                <td>${product.name}</td>
                <td>${product.purchasePrice.toFixed(2)} Tk</td>
                <td>${product.sellingPrice.toFixed(2)} Tk</td>
                <td>${product.quantity}</td>
                <td>${(product.purchasePrice * product.quantity).toFixed(2)} Tk</td>
                <td>${(product.sellingPrice * product.quantity).toFixed(2)} Tk</td>
                <td>${((product.sellingPrice - product.purchasePrice) * product.quantity).toFixed(2)} Tk</td>
            `;

            productList.appendChild(row);
        });

        const data = getCalculationData();

        document.getElementById("sumStock").textContent =
            "Total Stock Value: " + data.totalStockValue.toFixed(2) + " Tk";

        document.getElementById("sumRevenue").textContent =
            "Expected Revenue: " + data.expectedRevenue.toFixed(2) + " Tk";

        document.getElementById("sumProfit").textContent =
            "Expected Profit: " + data.expectedProfit.toFixed(2) + " Tk";
    }

</script>

</body>
</html>
