
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Payroll System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eafff8;
            padding: 20px;
        }
        .pg {
            max-width: 500px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 0 10px rgba(10, 2, 2, 0.1);
        }
        h2 {
            text-align: center;
            color: #000000;
            text-shadow: 0 1px rgb(0, 0, 0);
        }
        .form {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }
        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 10px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #015614;
        }
        .summary {
            margin-top: 20px;
            padding: 15px;
            background-color: #e9ecef;
            border-radius: 4px;
            display: none;
        }
    </style>
</head>
<body>

<div class="pg">
    <h2>Employee Payroll System</h2>

    <form id="payrollForm">

        <div class="form">
            <label for="employeeName">Employee Name:</label>
            <input type="text" id="employeeName" required>
        </div>

        <div class="form">
            <label for="basicSalary">Basic Salary (Tk):</label>
            <input type="number" id="basicSalary" min="0" required>
        </div>

        <div class="form">
            <label for="overtimeHours">Overtime Hours:</label>
            <input type="number" id="overtimeHours" min="0" required>
        </div>

        <button type="button" onclick="generatePayslip()">Generate Payslip</button>
    </form>

    <div id="summaryBox" class="summary">
        <h3>Employee Payslip</h3>
        <p id="sumName"></p>
        <p id="sumBasic"></p>
        <p id="sumHouse"></p>
        <p id="sumMedical"></p>
        <p id="sumTransport"></p>
        <p id="sumOvertime"></p>
        <p id="sumGross"></p>
        <p id="sumTax"></p>
        <p id="sumNet"></p>
    </div>
</div>

<script>

    const HOUSE_RENT_RATE = 0.20;
    const MEDICAL_RATE = 0.10;
    const TRANSPORT_RATE = 0.05;
    const OVERTIME_RATE = 500;

    // Task 1: Calculate Gross Salary
    function getCalculationData() {
        const basicSalary = parseFloat(document.getElementById("basicSalary").value);
        const overtimeHours = parseFloat(document.getElementById("overtimeHours").value);

        const houseRent = basicSalary * HOUSE_RENT_RATE;
        const medical = basicSalary * MEDICAL_RATE;
        const transport = basicSalary * TRANSPORT_RATE;
        const overtime = overtimeHours * OVERTIME_RATE;

        const grossSalary = basicSalary + houseRent + medical + transport + overtime;

        // Task 2: Calculate Tax
        let taxRate = 0;

        if (grossSalary > 100000) {
            taxRate = 0.15;
        } else if (grossSalary > 50000) {
            taxRate = 0.10;
        }

        const tax = grossSalary * taxRate;

        // Task 3: Calculate Net Salary
        const netSalary = grossSalary - tax;

        return {
            basicSalary,
            overtimeHours,
            houseRent,
            medical,
            transport,
            overtime,
            grossSalary,
            tax,
            netSalary
        };
    }

    // Task 4: Generate Payslip
    function generatePayslip() {
        const employeeName = document.getElementById("employeeName").value.trim();
        const basicSalary = document.getElementById("basicSalary").value;
        const overtimeHours = document.getElementById("overtimeHours").value;

        if (employeeName === "" || basicSalary === "" || overtimeHours === "" ||
            Number(basicSalary) < 0 || Number(overtimeHours) < 0) {
            alert("Please fill in all fields correctly!");
            return;
        }

        const data = getCalculationData();

        document.getElementById("sumName").textContent =
            "Employee Name: " + employeeName;

        document.getElementById("sumBasic").textContent =
            "Basic Salary: " + data.basicSalary.toFixed(2) + " Tk";

        document.getElementById("sumHouse").textContent =
            "House Rent (20%): " + data.houseRent.toFixed(2) + " Tk";

        document.getElementById("sumMedical").textContent =
            "Medical Allowance (10%): " + data.medical.toFixed(2) + " Tk";

        document.getElementById("sumTransport").textContent =
            "Transport Allowance (5%): " + data.transport.toFixed(2) + " Tk";

        document.getElementById("sumOvertime").textContent =
            "Overtime Payment: " + data.overtime.toFixed(2) + " Tk";

        document.getElementById("sumGross").textContent =
            "Gross Salary: " + data.grossSalary.toFixed(2) + " Tk";

        document.getElementById("sumTax").textContent =
            "Tax: " + data.tax.toFixed(2) + " Tk";

        document.getElementById("sumNet").textContent =
            "Net Salary: " + data.netSalary.toFixed(2) + " Tk";

        document.getElementById("summaryBox").style.display = "block";
    }

</script>

</body>
</html>
