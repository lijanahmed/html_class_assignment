<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant POS System</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #eafff8; padding: 20px; }
        .pg { max-width: 600px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 20px; box-shadow: 0 0 10px rgba(10, 2, 2, 0.1); }
        h2 { text-align: center; color: #000000; text-shadow: 0 1px rgb(0, 0, 0); }
        .form { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input[type="text"], input[type="number"], select { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 10px; }
        .qty { width: 60px; }
        .error { color: red; font-size: 15px; }
        button { width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; border-radius: 20px; font-size: 16px; cursor: pointer; margin-bottom: 8px; }
        button:hover { background-color: #015614; }
        .del { padding: 4px 8px; width: auto; font-size: 13px; background-color: #dc3545; margin: 0; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 10px; }
        th, td { border: 1px solid #ccc; padding: 6px; text-align: left; font-size: 14px; }
        .summary { margin-top: 20px; padding: 15px; background-color: #e9ecef; border-radius: 4px; display: none; }
        @media print {
            body { background: #fff; }
            .noPrint { display: none; }
            .pg { box-shadow: none; }
        }
    </style>
</head>
<body>

<div class="pg">
    <h2>Restaurant POS</h2>

    <div class="noPrint">
        <div class="form">
            <label for="item">Menu Item:</label>
            <select id="item">
                <option value="Burger|250">Burger - 250 Tk</option>
                <option value="Pizza|800">Pizza - 800 Tk</option>
                <option value="Fried Rice|350">Fried Rice - 350 Tk</option>
                <option value="Coffee|120">Coffee - 120 Tk</option>
                <option value="Soft Drink|50">Soft Drink - 50 Tk</option>
            </select>
        </div>
        <button type="button" onclick="addItem()">Add Item</button>
    </div>

    <h3>Order</h3>
    <table id="orderTable"></table>
    <p id="emptyMsg">No items added.</p>

    <p id="subTxt">Subtotal: 0 Tk</p>
    <p id="vatTxt">VAT (15%): 0 Tk</p>
    <p id="srvTxt">Service Charge (5%): 0 Tk</p>
    <p id="totTxt"><b>Total: 0 Tk</b></p>

    <button type="button" class="noPrint" onclick="generateInvoice()">Generate Invoice</button>

    <div id="summaryBox" class="summary">
        <h3>Invoice</h3>
        <div id="invoiceBody"></div>
        <button type="button" class="noPrint" onclick="window.print()">Print Invoice</button>
    </div>
</div>

<script>
    const VAT_RATE = 0.15;
    const SERVICE_RATE = 0.05;

    let order = [];

    // Task 1: Add multiple items
    function addItem() {
        const parts = document.getElementById("item").value.split("|");
        const name = parts[0];
        const price = parseInt(parts[1]);

        const existing = order.find(o => o.name === name);
        if (existing) {
            existing.qty++;
        } else {
            order.push({ name: name, price: price, qty: 1 });
        }
        drawOrder();
    }

    // Task 2: Update quantity (onchange / onkeyup)
    function changeQty(index, value) {
        const q = parseInt(value);
        if (!isNaN(q) && q >= 1) {
            order[index].qty = q;
            updateTotals();
            updateRowTotal(index);
        }
    }

    // Task 3: Remove item
    function removeItem(index) {
        order.splice(index, 1);
        drawOrder();
    }

    function updateRowTotal(index) {
        const cell = document.getElementById("rowTotal" + index);
        if (cell) cell.textContent = order[index].price * order[index].qty;
    }

    function drawOrder() {
        let html = "<tr><th>Item</th><th>Price</th><th>Qty</th><th>Total</th><th></th></tr>";
        order.forEach((o, i) => {
            html += "<tr><td>" + o.name + "</td><td>" + o.price + "</td>" +
                    "<td><input type='number' class='qty' min='1' value='" + o.qty +
                    "' onchange='changeQty(" + i + ", this.value)' onkeyup='changeQty(" + i + ", this.value)'></td>" +
                    "<td id='rowTotal" + i + "'>" + (o.price * o.qty) + "</td>" +
                    "<td><button type='button' class='del' onclick='removeItem(" + i + ")'>Remove</button></td></tr>";
        });
        document.getElementById("orderTable").innerHTML = order.length ? html : "";
        document.getElementById("emptyMsg").style.display = order.length ? "none" : "block";
        updateTotals();
    }

    // Tasks 4, 5, 6: Subtotal, VAT, Service Charge
    function getTotals() {
        let subtotal = 0;
        order.forEach(o => { subtotal += o.price * o.qty; });
        const vat = subtotal * VAT_RATE;
        const service = subtotal * SERVICE_RATE;
        const total = subtotal + vat + service;
        return { subtotal, vat, service, total };
    }

    function updateTotals() {
        const t = getTotals();
        document.getElementById("subTxt").textContent = "Subtotal: " + t.subtotal.toFixed(2) + " Tk";
        document.getElementById("vatTxt").textContent = "VAT (15%): " + t.vat.toFixed(2) + " Tk";
        document.getElementById("srvTxt").textContent = "Service Charge (5%): " + t.service.toFixed(2) + " Tk";
        document.getElementById("totTxt").innerHTML = "<b>Total: " + t.total.toFixed(2) + " Tk</b>";
    }

    // Task 7: Printable invoice
    function generateInvoice() {
        if (order.length === 0) {
            alert("Please add at least one item!");
            return;
        }
        const t = getTotals();
        const invNo = "POS-" + Date.now().toString().slice(-6);

        let html = "<p>Invoice No: " + invNo + "<br>Date: " + new Date().toLocaleString() + "</p>";
        html += "<table><tr><th>Item</th><th>Price</th><th>Qty</th><th>Total</th></tr>";
        order.forEach(o => {
            html += "<tr><td>" + o.name + "</td><td>" + o.price + "</td><td>" + o.qty +
                    "</td><td>" + (o.price * o.qty) + "</td></tr>";
        });
        html += "</table>";
        html += "<p>Subtotal: " + t.subtotal.toFixed(2) + " Tk</p>";
        html += "<p>VAT (15%): " + t.vat.toFixed(2) + " Tk</p>";
        html += "<p>Service Charge (5%): " + t.service.toFixed(2) + " Tk</p>";
        html += "<p><b>Grand Total: " + t.total.toFixed(2) + " Tk</b></p>";

        document.getElementById("invoiceBody").innerHTML = html;
        document.getElementById("summaryBox").style.display = "block";
    }

    drawOrder();
</script>

</body>
</html>
